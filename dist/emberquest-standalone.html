<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="現実の一歩で剣を鍛え、闇に道を開く。任務を果たして冒険を進めるRPG。">
  <title>EMBERQUEST — 灰の旅人</title>
  <style>
:root {
  --bg:#101114; --panel:#1c2025; --text:#e8e3d9; --muted:#a6adb5;
  --line:#343940; --ember:#d97a42; --gold:#b9a16b; --red:#a44952;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  color:var(--text); background:var(--bg); color-scheme:dark; font-synthesis:none;
}
* { box-sizing:border-box; }
body { margin:0; background:radial-gradient(ellipse at 24% 0,#3d302025,transparent 65%),var(--bg); }
button,input,textarea,select { font:inherit; }
button { color:inherit; border:0; background:none; cursor:pointer; }
button:disabled { opacity:.4; cursor:default; }
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible { outline:2px solid var(--ember); outline-offset:4px; }
svg { vertical-align:middle; flex-shrink:0; }
h1,h2,h3,p { margin:0; }
h1,h2,.serif { font-family:'Iowan Old Style','Palatino Linotype','Hiragino Mincho ProN','Yu Mincho',serif; }
h1,h2,h3,.stepbox,.source,.first-step { overflow-wrap:anywhere; }
header { max-width:1440px; margin:auto; padding:21px 4%; display:flex; justify-content:space-between; align-items:center; gap:20px; border-bottom:1px solid #343536; }
.brand { display:flex; align-items:center; gap:12px; font:18px Georgia,serif; letter-spacing:4px; }
.brand svg { color:#e49a63; }
.header-stats { display:flex; align-items:center; gap:20px; font-size:11px; color:#c8c9c7; }
.shell { max-width:1380px; margin:auto; padding:28px 4% 110px; }
.page { display:none; }
.page.active { display:block; }
.chapterbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.chapterbar h1 { font-size:29px; font-weight:400; letter-spacing:3px; }
.chapterbar .chapter-label { color:#b9a16b; font-size:10px; margin-bottom:8px; letter-spacing:2px; }
.chapterbar .goal { font-size:11px; color:var(--muted); margin-top:8px; line-height:1.8; }
.chapterindex { color:#363737; font:50px Georgia,serif; letter-spacing:-3px; }
.home-grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(350px,1fr); gap:24px; align-items:start; }
.visual-col,.action-col { min-width:0; }
.scene { height:430px; position:relative; overflow:hidden; border:1px solid #504b43; border-radius:5px; background:#111a24; }
.scene>svg { display:block; width:100%; height:100%; }
.scene:after { content:''; position:absolute; inset:0; background:linear-gradient(0deg,#080c13ed,transparent 33%,transparent 75%,#0b101633); pointer-events:none; }
.scenetop { position:absolute; z-index:2; left:20px; right:20px; top:18px; display:flex; justify-content:space-between; align-items:center; font-size:10px; color:#c8c2b8; }
.scene-tag { padding:6px 10px; background:#121820b8; border:1px solid #776955; border-radius:2px; }
.scene-caption { position:absolute; left:22px; right:22px; bottom:20px; z-index:2; }
.boss-row { display:flex; justify-content:space-between; gap:10px; font-size:11px; color:#d5c5bb; margin-bottom:8px; }
.scene-caption h2 { margin-top:12px; font-size:18px; font-weight:400; letter-spacing:2px; }
.bar { height:4px; background:#10141a; overflow:hidden; border-radius:3px; }
.bar>span { display:block; height:100%; background:var(--red); transition:width .55s; }
.bar.exp>span { background:var(--gold); }
.bar.muted-bar>span { background:#8a806c; }
.main-task { padding:25px; background:linear-gradient(140deg,#3b2c1e55,#1c2025); border:1px solid #8f6d45; border-radius:5px; position:relative; }
.main-task:before { content:''; position:absolute; left:25px; right:25px; top:-1px; height:1px; background:linear-gradient(90deg,transparent,#d1a365,transparent); }
.main-label { font-size:10px; color:#d4b27e; display:flex; align-items:center; gap:7px; }
.main-task h2 { font:500 21px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI','Yu Gothic',sans-serif; margin:14px 0 12px; }
.stepbox { border-left:2px solid #b76e43; margin:17px 0; padding-left:13px; font-size:13px; color:#d9d3c7; line-height:1.9; }
.stepbox .caption { display:block; font-size:10px; color:#c0a378; margin-bottom:4px; }
.condition { font-size:11px; line-height:1.9; color:#bcc0c1; margin:12px 0 18px; }
.main-task .tagrow { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.tag { display:inline-flex; align-items:center; gap:4px; font-size:10px; padding:4px 7px; border:1px solid #4b4c46; color:#bfc3c1; border-radius:2px; }
.tag.urgent { color:#e2a8aa; border-color:#72464a; }
.primary { display:inline-flex; justify-content:center; align-items:center; gap:9px; padding:12px 18px; color:#fff2e2; background:#c66e3f; border:1px solid #df8c57; border-radius:3px; font-size:12px; }
.primary:hover { background:#db8552; }
.primary.full { width:100%; }
.secondary { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid #555953; padding:10px 14px; border-radius:3px; background:#20252a; font-size:12px; }
.secondary:hover { background:#2b2e30; border-color:#9d8663; }
.ghost { display:inline-flex; align-items:center; justify-content:center; gap:6px; color:var(--muted); font-size:11px; padding:7px; }
.ghost:hover { color:var(--text); }
.iconbtn { padding:7px; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); border-radius:3px; }
.iconbtn:hover { background:#ffffff0b; color:#e0c392; }
.gold { color:#cbb381; }
.orange { color:#efa573; }
.muted { color:var(--muted); }
.tiny { font-size:11px; line-height:1.9; }
.eyebrow { color:var(--gold); font:9px sans-serif; letter-spacing:2px; }
.between { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.flex { display:flex; align-items:center; gap:10px; }
.panel { padding:22px; background:linear-gradient(135deg,#20242a,#1a1e23); border:1px solid var(--line); border-radius:5px; }
.reward-preview { margin:13px 0 0; padding:17px 18px; border:1px solid #4d493f; background:#26251f; display:flex; align-items:flex-start; gap:12px; border-radius:4px; }
.reward-preview .headline { color:#e6ce9d; font-size:12px; line-height:1.8; }
.reward-preview p { color:#bcbcaf; font-size:10px; line-height:1.9; margin-top:6px; }
.reward-preview .icon { color:#c69c62; padding-top:2px; }
.task-section { margin-top:24px; }
.section-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; gap:10px; }
.section-head h2 { font-size:17px; font-weight:400; }
.filters { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:10px; }
.filter { font-size:10px; color:var(--muted); padding:6px 9px; border:1px solid transparent; border-radius:3px; }
.filter.active { color:#e2c998; border-color:#5e5542; background:#353128; }
.task-row { display:flex; align-items:flex-start; gap:12px; padding:16px 0; border-bottom:1px solid #34383e; }
.task-row .body { flex:1; min-width:0; }
.task-row h3 { font-size:13px; font-weight:400; line-height:1.8; overflow-wrap:anywhere; }
.task-row .meta { color:var(--muted); font-size:10px; display:flex; gap:9px; flex-wrap:wrap; margin-top:7px; }
.task-row.done h3 { color:#969e9e; text-decoration:line-through; }
.task-options { display:flex; gap:1px; align-items:center; }
.task-options .iconbtn { padding:4px; }
.checkbtn { border:1px solid #68706f; border-radius:50%; width:24px; height:24px; min-width:24px; margin-top:2px; display:grid; place-items:center; padding:0; }
.checkbtn:hover { color:var(--ember); border-color:var(--ember); }
.done .checkbtn { color:#b9c8a4; background:#424c39; border-color:#637253; }
.empty { text-align:center; padding:23px 16px; font-size:12px; color:#adb2b7; line-height:1.9; border:1px dashed #46483f; border-radius:3px; }
.end-link { margin-top:22px; padding-top:17px; border-top:1px solid #3f3a33; display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:10px; color:var(--muted); }
.day-ended { padding:16px 20px; margin-bottom:15px; background:#252822; border:1px solid #5e6351; border-radius:4px; }
.day-ended h2 { font-size:18px; font-weight:400; margin-bottom:7px; }
.intro-copy { padding:20px 5px 0; color:#9fa8ac; font-size:12px; line-height:2; max-width:500px; }
.first-preview { margin-top:18px; padding:15px 18px; display:flex; gap:17px; align-items:center; border:1px solid #5b4a37; background:linear-gradient(130deg,#2c241f,#191e25); border-radius:4px; }
.first-preview>svg { width:78px; height:105px; }
.first-preview h3 { font-size:14px; font-weight:400; font-family:serif; color:#dfc59b; margin-bottom:7px; }
.first-preview p { font-size:11px; color:#b2b8bb; line-height:1.8; }
.inline-result { margin:16px 0 0; padding:16px 18px; border:1px solid #6b593e; background:linear-gradient(135deg,#332b1c,#20252a); border-radius:4px; }
.inline-result h3 { font:18px/1.7 serif; font-weight:400; margin:7px 0; }
.inline-result .gains { display:flex; gap:15px; flex-wrap:wrap; color:#e5c183; font-size:12px; margin:9px 0; }
.inline-result .source { font-size:10px; line-height:1.9; color:#b4b8b6; }
.roadmap { display:flex; margin:20px 0 0; padding:20px 0; border-top:1px solid #34383d; border-bottom:1px solid #34383d; }
.roadstop { flex:1; position:relative; text-align:center; font-size:10px; color:#9ca5ab; line-height:1.8; }
.roadstop:before { content:''; position:absolute; height:1px; background:#4b4d4c; top:13px; left:0; right:0; }
.roadstop:first-child:before { left:50%; }
.roadstop:last-child:before { right:50%; }
.roadstop>span { position:relative; display:grid; place-items:center; width:27px; height:27px; margin:auto auto 10px; border:1px solid #4b504e; background:#1b2026; border-radius:50%; }
.roadstop.done>span { background:#7c6948; color:#e8d9bd; }
.roadstop.active { color:#e5cc9b; }
.roadstop.active>span { border-color:#c3945e; box-shadow:0 0 15px #e5af5820; }
.wide-title { margin:5px 0 26px; }
.wide-title h1 { font-size:29px; font-weight:400; letter-spacing:3px; margin-bottom:12px; }
.wide-title p { font-size:12px; color:var(--muted); line-height:1.9; }
.route-options { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:20px 0; }
.route { padding:18px; border:1px solid #454b4b; border-radius:4px; text-align:left; display:flex; align-items:flex-start; gap:12px; background:#191e24; }
.route.active { border-color:#a88b5a; background:#2c2821; }
.route strong { display:block; font-size:13px; font-weight:500; margin-bottom:9px; }
.route p { font-size:11px; line-height:1.8; color:var(--muted); }
.region-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin:23px 0; }
.region-card.selected { border-color:#92764f; }
.region-card h2 { font-size:23px; font-weight:400; margin:13px 0; }
.region-card p { color:var(--muted); font-size:11px; line-height:1.8; min-height:42px; }
.region-card .secondary { margin-top:17px; width:100%; }
.encounter-list { padding:20px; margin:18px 0; }
.encounter-row { padding:16px 0; border-bottom:1px solid #353b40; display:flex; align-items:center; justify-content:space-between; gap:20px; }
.encounter-row:last-child { border:0; }
.encounter-row h3 { font-size:14px; font-weight:400; margin-bottom:8px; }
.equipment-grid { display:grid; grid-template-columns:1fr 1.1fr; gap:27px; }
.portrait { position:relative; text-align:center; padding:24px; background:radial-gradient(ellipse at 50% 35%,#66564580,transparent 60%),#171d24; border:1px solid #554d41; border-radius:5px; }
.portrait .fullbody { height:390px; width:100%; display:block; }
.portrait .name { font:23px serif; letter-spacing:4px; margin:12px 0; }
.portrait .fullbody .knight { filter:drop-shadow(-3px -1px 3px #c5a26b40); }
.statrow { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:#3d4347; border:1px solid #3d4347; border-radius:3px; overflow:hidden; margin-top:22px; }
.statrow>div { padding:17px 8px; background:#1b2128; font-size:10px; color:var(--muted); }
.statrow b { display:block; color:#d0b37a; font:24px Georgia,serif; margin-bottom:7px; }
.weapon-selector { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
.weapon-select { padding:13px; border:1px solid #4c504c; text-align:left; border-radius:3px; }
.weapon-select.active { border-color:#b08e5a; background:#2b2822; }
.weapon-select span { display:block; font-size:10px; color:var(--muted); margin-top:7px; }
.weapon-panel { padding:23px; }
.weapon-panel h2 { font-size:22px; font-weight:400; margin:12px 0 9px; }
.weapon-panel .description { font-size:12px; color:var(--muted); line-height:1.9; }
.forge-preview { margin:23px 0; display:grid; grid-template-columns:1fr 24px 1fr; align-items:center; gap:10px; }
.forge-preview .preview-person { text-align:center; min-width:0; }
.preview-person>svg { height:175px; width:100%; display:block; }
.preview-person strong { display:block; font-size:11px; font-weight:400; color:#ded1b7; line-height:1.9; margin-top:8px; }
.preview-person small { display:block; color:var(--muted); font-size:10px; }
.preview-person.after { border:1px solid #705b3d; background:radial-gradient(ellipse at center,#90633122,transparent 70%); padding:12px 5px; border-radius:4px; }
.costrow { padding:15px 0; border-top:1px solid #3e4140; display:flex; justify-content:space-between; font-size:12px; color:#d7c295; margin-bottom:12px; }
.camp-grid { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
.camp-card { margin-bottom:22px; }
.camp-card h2 { font-size:19px; font-weight:400; margin-bottom:19px; }
.camp-state { display:flex; align-items:center; gap:10px; padding:14px 0; border-bottom:1px solid #353b40; font-size:12px; }
.camp-state svg { color:#bea16e; }
.history { max-height:430px; overflow:auto; }
.history>div { padding:14px 0; border-bottom:1px solid #343a3f; font-size:11px; line-height:1.9; overflow-wrap:anywhere; }
.setting { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid #353a40; gap:20px; }
.setting label { font-size:12px; line-height:1.8; }
.setting small { display:block; font-size:10px; color:var(--muted); }
input[type=checkbox] { accent-color:var(--ember); width:18px; height:18px; }
input[type=range] { accent-color:var(--ember); width:100px; }
.metrics { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.metric { padding:16px; background:#161b21; border:1px solid #373c40; color:var(--muted); font-size:10px; line-height:1.8; }
.metric b { display:block; color:#dec292; font:24px Georgia,serif; margin-bottom:8px; }
.daily-record { padding:17px 0; border-bottom:1px solid #383c3e; }
.daily-record h3 { font-family:serif; font-size:17px; font-weight:400; margin-bottom:9px; }
.daily-record p { font-size:11px; line-height:1.9; color:var(--muted); }
.summary-part { margin:20px 0; padding-bottom:16px; border-bottom:1px solid #3c4144; }
.summary-part h3 { font-size:12px; color:#cbb386; font-weight:500; margin-bottom:12px; }
.summary-part ul { padding-left:18px; margin:0; font-size:12px; line-height:2; color:#d2d4ce; }
.inline-check { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); margin:15px 0; }
.bottomnav { position:fixed; z-index:20; bottom:0; left:0; right:0; background:#13171df5; backdrop-filter:blur(16px); border-top:1px solid #363c41; display:flex; justify-content:center; gap:40px; padding:8px 16px max(10px,env(safe-area-inset-bottom)); }
.bottomnav button { display:flex; flex-direction:column; align-items:center; gap:6px; width:85px; font-size:10px; color:#a5abb0; padding:5px; }
.bottomnav button.active { color:#e6a16c; }
.bottomnav button.active:before { content:''; position:absolute; top:-1px; width:30px; height:2px; background:var(--ember); }
dialog { width:490px; max-width:92vw; max-height:90dvh; background:#1c2228; color:var(--text); border:1px solid #7a6b54; border-radius:6px; padding:27px; box-shadow:0 20px 100px #000c; }
dialog::backdrop { background:#070b10e6; backdrop-filter:blur(7px); }
dialog h2 { font-size:23px; font-weight:400; letter-spacing:1px; }
label.field { display:block; font-size:11px; color:#c9c9bf; margin:15px 0 8px; }
input:not([type=checkbox]):not([type=range]),textarea,select { width:100%; padding:11px; border:1px solid #4c5359; background:#131a21; color:#e5e4dc; font-size:13px; border-radius:3px; }
input::placeholder,textarea::placeholder { color:#929ba2; }
textarea { min-height:65px; resize:vertical; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 15px; }
.templates { display:flex; gap:6px; flex-wrap:wrap; margin:15px 0; }
.templates button { border:1px solid #695c45; background:#302a21; color:#d7bb8a; padding:7px 10px; font-size:11px; border-radius:3px; }
details { margin:17px 0; }
summary { cursor:pointer; color:#d1b37d; font-size:11px; line-height:1.9; padding:7px 0; }
.dialogactions { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:22px; }
.focus-overlay { position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 90%,#54321f44,transparent 60%),#101114; padding:28px; overflow:auto; }
.focus-overlay.visible { display:flex; }
.focus-leave { position:absolute; right:22px; top:23px; }
.focus-inner { width:100%; max-width:520px; text-align:center; }
.focus-inner h2 { font-size:28px; font-weight:400; line-height:1.8; margin:25px 0 20px; }
.first-step { padding:21px; border-top:1px solid #4e473d; border-bottom:1px solid #4e473d; font-size:14px; color:#d7c8ab; line-height:1.9; margin:20px 0; }
.focus-inner p { color:#b8c0c2; font-size:12px; line-height:2; }
.timer { font:64px Georgia,serif; letter-spacing:3px; margin:22px 0 15px; color:#e4c9a2; font-variant-numeric:tabular-nums; }
.focus-inner .primary { margin-top:25px; }
.focus-note { font-size:10px!important; margin-top:20px; }
.toast { position:fixed; bottom:95px; left:50%; transform:translateX(-50%); max-width:90vw; z-index:80; border:1px solid #95805e; border-radius:4px; background:#2a2b27; color:#ebd5ad; padding:13px 20px; font-size:12px; line-height:1.8; box-shadow:0 10px 30px #0009; }
.hidden { display:none!important; }
.animation-message { position:absolute; inset:40% 20px auto; text-align:center; color:#f4c486; font:24px serif; letter-spacing:2px; text-shadow:0 3px 16px #000; z-index:4; pointer-events:none; }
.damage-number { position:absolute; left:70%; top:34%; color:#ffe2b1; font:32px Georgia,serif; opacity:0; z-index:5; text-shadow:0 2px 8px #000; }
.scene.striking .damage-number { animation:damage .9s .45s ease-out; }
.slash { opacity:0; stroke-dasharray:500; stroke-dashoffset:500; }
.scene.striking .slash { animation:slash .7s .35s ease-out; }
.scene.striking:not(.dual) .slash.second { display:none; }
.scene.striking.dual .slash { animation:slash .4s .15s ease-out 3; }
.scene.striking.dual .slash.second { animation-delay:.3s; }
.scene.striking .hero-stage { animation:lunge .8s ease-in-out; }
.scene.striking .blade { animation:swing .8s ease-in-out; transform-origin:155px 115px; }
.scene.striking .enemy-figure { animation:hit .5s .6s ease-out; }
.scene.striking.dual .enemy-figure { animation:hit .4s .25s 3 ease-out; }
.scene .embers { animation:embers 7s infinite ease-in-out; }
.scene .mist { animation:mist 15s infinite alternate ease-in-out; }
.flame { animation:flame 1.7s infinite alternate; transform-origin:50% 90%; }
.scene .cloak { animation:cloak 7s infinite alternate; transform-origin:100px 90px; }
.after-forge .fullbody { animation:forged 1.6s ease-out; }
.reduced *, .reduced *:before, .reduced *:after { animation:none!important; transition:none!important; }
@keyframes slash { 10%{opacity:1}70%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0} }
@keyframes lunge { 45%{transform:translate(125px,99px) scale(1.18)} }
@keyframes swing { 40%{transform:rotate(13deg)}65%{transform:rotate(-18deg)} }
@keyframes hit { 35%{filter:brightness(1.9);transform:translateX(7px)} }
@keyframes damage { 20%{opacity:1}75%{opacity:1;transform:translateY(-22px)}100%{opacity:0;transform:translateY(-35px)} }
@keyframes embers { 50%{transform:translate(5px,-12px);opacity:.3} }
@keyframes mist { to{transform:translateX(-45px)} }
@keyframes flame { to{opacity:.6;transform:skewX(4deg)} }
@keyframes cloak { to{transform:skewX(-1.4deg)} }
@keyframes forged { 15%{filter:brightness(1.6) drop-shadow(0 0 15px #e5b477)} }
@media(min-width:901px) {
  .home-grid .visual-col { position:sticky; top:20px; }
  .main-task { min-height:260px; }
  .desktop-legend { display:block; }
}
@media(max-width:900px) {
  header { padding:16px 5%; }
  .brand { font-size:16px; letter-spacing:3px; }
  .header-stats { font-size:10px; gap:12px; }
  .header-title { display:none; }
  .shell { padding:16px 5% 110px; }
  .chapterbar { margin-bottom:12px; }

    laundry: { title: '洗濯をする', minutes: 10, step: '洗濯物を集める', condition: '洗濯物を洗濯機に入れ、運転を始める' },
    mail: { title: '必要なメールに返信する', minutes: 5, step: '返信するメールを1通開く', condition: '返信文を見直して、送信する' }
  };
  const t = templates[name]; if (!t) return;
  for (const k of ['title','minutes','step','condition']) f.elements.namedItem(k).value = t[k];
  f.elements.namedItem('energy').value = 'auto'; updateRewardHint();
}
$('taskForm').addEventListener('change', updateRewardHint);
$('taskForm').addEventListener('submit', event => {
  event.preventDefault();
  const data = Object.fromEntries(new FormData(event.target));
  data.title = data.title.trim(); if (!data.title) return;
  const minutes = Math.max(1, Math.min(240, Number(data.minutes) || 25));
  const patch = { title: data.title, minutes, energy: data.energy === 'auto' ? energyFor(minutes) : Number(data.energy),
    autoEnergy: data.energy === 'auto', repeat: data.repeat, condition: data.condition.trim(), step: data.step.trim(),
    due: data.due, scheduled: data.scheduled, priority: Number(data.priority), project: data.project.trim() };
  let task = state.tasks.find(t => t.id === data.id);
  if (task) {
    Object.assign(task, patch);
    if (!done(task)) task.occurrence = task.scheduled || task.occurrence;
  } else {
    const id = uid();
    task = { ...patch, id, seriesId: id, occurrence: data.scheduled || today(), createdAt: Date.now(), firstStart: null, importedDone: false, deleted: false };
    state.tasks.push(task);
    if (!state.main[today()] && task.scheduled === today()) state.main[today()] = id;
  }
  save(); $('taskDialog').close(); render(); toast('任務を記録しました。');
});
function startTask(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task || done(task) || superseded(task)) return;
  if (!task.firstStart) task.firstStart = Date.now();
  if (state.daily[today()]) state.daily[today()].reopened = true;
  focus = { taskId: id, remaining: task.minutes * 60000, running: false, endAt: 0, showTimer: true };
  save(); renderFocus(); $('focusOverlay').classList.add('visible');
  setOutsideInert(true);
  $('focusOverlay').querySelector('[data-action=complete]')?.focus();
  clearInterval(focusTimer); focusTimer = setInterval(updateTimer, 500);
}
function setOutsideInert(value) {
  for (const selector of ['main', 'header', 'nav']) document.querySelector(selector).inert = value;
}
function leaveFocus() {
  focus = null; clearInterval(focusTimer);
  $('focusOverlay').classList.remove('visible'); setOutsideInert(false); render();
}
function remaining() { return focus?.running ? Math.max(0, focus.endAt - Date.now()) : focus?.remaining || 0; }
function renderFocus() {
  const task = state.tasks.find(t => t.id === focus?.taskId); if (!task) return;
  $('focusInner').innerHTML = `<span class="tiny gold">今は、この一歩だけ。</span><h2 id="focusTitle">${esc(task.title)}</h2><div class="first-step">${esc(task.step || '必要な資料や道具を開き、最初の一つに取りかかる。')}</div>${task.condition ? '<p>今回の完了条件：' + esc(task.condition) + '</p>' : ''}
    <button class="ghost" data-action="toggle-timer">${icon('clock', 14)}${focus.showTimer ? 'タイマーを隠す' : 'タイマーを表示'}</button><div class="${focus.showTimer ? '' : 'hidden'}"><div class="timer" id="timerText"></div><button class="secondary" data-action="timer">${focus.running ? '一時停止' : '集中タイマーを始める'}</button></div>
    <p class="focus-note" id="timerNote">時間だけでは完了しません。予定した工程まで進めてください。</p><button class="primary" data-action="complete" data-id="${esc(task.id)}">${icon('check', 16)}今回の工程を完了する</button><p class="focus-note">課題全体が未完成でも、この工程を果たせば達成です。</p>`;
  updateTimer();
}
function updateTimer() {
  if (!focus || !$('timerText')) return;
  const seconds = Math.ceil(remaining() / 1000);
  $('timerText').textContent = String(Math.floor(seconds / 60)).padStart(2,'0') + ':' + String(seconds % 60).padStart(2,'0');
  if (seconds === 0 && focus.running) {
    focus.running = false; focus.remaining = 0;
    $('timerNote').textContent = '区切りの時間です。今回の成果を確かめてから、完了してください。';
  }
}
function completeTask(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task || done(task) || superseded(task)) return;
  const event = { id: uid(), type: 'complete', taskId: id, title: task.title, energy: task.energy,
    main: state.main[today()] === id, day: today(), at: Date.now(), region: state.region, route: state.route };
  state.events.push(event); lastResultSession = event.id;
  save(); // Persist before any presentation or animation.
  if (focus) leaveFocus(); else render();
  const result = game.results.find(r => r.eventId === event.id);
  if (view === 'tasks') window.scrollTo({ top: 0, behavior: state.settings.reduced ? 'instant' : 'smooth' });
  if (result) { animationQueue.push(result); if (!animating) playNext(); }
}
function playNext() {
  if (!animationQueue.length) { animating = false; return; }
  animating = true;
  const r = animationQueue.shift();
  if (view !== 'tasks' || state.region !== r.region) { playNext(); return; }
  const frame = { ...game, stages: [...game.stages], health: game.health.map(a => [...a]), tiers: { ...game.tiers }, cleared: [...game.cleared], equipped: r.weapon };
  if (!r.repeat) { frame.stages[r.region] = r.encounterIndex; frame.health[r.region][r.encounterIndex] = r.beforeHp; frame.cleared[r.region] = false; }
  frame.tiers[r.weapon] = r.tier;
  $('battleScene').outerHTML = sceneBlock(frame);
  const scene = $('battleScene'), message = $('animationMessage'), number = $('damageNumber');
  scene.classList.remove('striking', 'dual'); void scene.offsetWidth;
  if (r.damage) scene.classList.add('striking');
  if (r.weapon === 'dual') scene.classList.add('dual');
  message.classList.remove('hidden');
  message.textContent = r.victory ? '闇に、道を開いた。' : r.cache ? '鍛造資材を見つけた。' : r.repeat ? '剣を育てる、次の素材。' : r.breakthrough ? r.encounter + 'を突破。' : r.weapon === 'dual' ? '三つの刃が、闇を裂く。' : 'その行動を、一撃に。';
  number.textContent = r.weapon === 'dual' ? r.hits.join(' + ') : r.damage || '';
  sound(r.victory ? 'victory' : r.cache ? 'forge' : 'strike', r.region);
  if (r.weapon === 'dual' && r.damage) soundTimer = setTimeout(() => sound('strike', r.region), 270);
  clearTimeout(animationTimer);
  animationTimer = setTimeout(() => {
    if (view === 'tasks' && state.region === r.region && $('battleScene')) $('battleScene').outerHTML = sceneBlock();
    if (r.victory) toast(REGIONS[r.region].name + 'を踏破。次の景色が解放されました。');
    playNext();
  }, state.settings.reduced || matchMedia('(prefers-reduced-motion: reduce)').matches ? 150 : 2500);
}
function sound(kind, region = state.region) {
  if (state.settings.mute) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume();
    const now = audioCtx.currentTime, notes = kind === 'victory' ? [110,146.83,220] : kind === 'forge' ? [294,147,73] : [85,68,56];
    notes.forEach((hz, index) => {
      const oscillator = audioCtx.createOscillator(), gain = audioCtx.createGain(), t = now + index * .1;
      oscillator.type = kind === 'strike' ? 'triangle' : 'sine';
      oscillator.frequency.setValueAtTime(hz * (1 + region * .12), t);
      oscillator.frequency.exponentialRampToValueAtTime(hz * .6, t + .3);
      gain.gain.setValueAtTime(.0001, t); gain.gain.exponentialRampToValueAtTime(Math.max(.0001, state.settings.volume * .25), t + .015);
      gain.gain.exponentialRampToValueAtTime(.0001, t + .75);
      oscillator.connect(gain); gain.connect(audioCtx.destination); oscillator.start(t); oscillator.stop(t + .8);
    });
  } catch (error) { /* Audio is optional. */ }
}
function confirmAction(title, message, callback) {
  $('confirmTitle').textContent = title; $('confirmText').textContent = message;
  confirmCallback = callback; $('confirmDialog').showModal();
}
function undoTask(id) {
  const event = state.events.find(e => e.type === 'complete' && e.taskId === id);
  if (!event) return;
  confirmAction('完了を取り消しますか？', '素材・経験値・遭遇の突破を再計算します。後の戦闘結果も変わり、素材不足や前提不足になった強化は取り消されます。', () => {
    state.events = state.events.filter(e => e.id !== event.id);
    clearAnimation(); lastResultSession = null;
    const invalid = new Set(replay(state).invalid);
    state.events = state.events.filter(e => !invalid.has(e.id));
    save(); render(); toast(invalid.size ? '完了を取り消し、成立しなくなった鍛造も戻しました。' : '完了と、その成果を取り消しました。');
  });
}
function forge(id) {
  if (!WEAPONS.some(w => w.id === id)) return;
  const cost = forgeCost(game.tiers[id]);
  if (game.iron < cost.iron || game.ember < cost.ember) return;
  const tier = game.tiers[id] + 1;
  state.events.push({ id: uid(), type: 'forge', weapon: id, targetTier: tier, day: today(), at: Date.now() });
  lastForge = { weapon: id, name: weaponName(id, tier) }; selectedWeapon = id;
  save(); render(); sound('forge'); toast('《' + lastForge.name + '》を鍛造して装備しました。');
}
function openEndDay() {
  const day = today(), existing = state.daily[day], results = resultsForDay(day), achievements = dayAchievements(day);
  $('endSummary').innerHTML = `<div class="summary-part"><h3>主目標</h3><p class="tiny">${results.some(r => r.main) ? '達成' : state.main[day] ? 'まだ途中。続きは明日でも大丈夫です。' : '今日は設定なし'}</p></div>
    <div class="summary-part"><h3>現実で進めたこと</h3>${results.length ? '<ul>' + results.map(r => '<li>' + esc(r.title) + '</li>').join('') + '</ul>' : '<p class="tiny muted">今日は休息の日。装備や成長は失われません。</p>'}</div>
    <div class="summary-part"><h3>冒険の成果</h3>${achievements.length ? '<ul>' + achievements.map(a => '<li>' + esc(a) + '</li>').join('') + '</ul>' : '<p class="tiny muted">' + (results.length ? '次の突破に向けた一撃と素材が残りました。' : '焚き火は、まだ消えていない。') + '</p>'}<p class="tiny gold" style="margin-top:10px">鉄片 +${results.reduce((n, r) => n + (r.iron || 0), 0)} / EXP +${results.reduce((n, r) => n + (r.xp || 0), 0)}</p></div>`;
  $('endForm').reset(); $('tomorrowStep').value = existing?.tomorrow || ''; $('dayNote').value = existing?.note || '';
  $('endDialog').showModal(); fillIcons($('endDialog'));
}
$('endForm').addEventListener('submit', event => {
  event.preventDefault();
  const form = new FormData(event.target), day = today(), tomorrow = String(form.get('tomorrow') || '').trim();
  const record = { ...state.daily[day], tomorrow, note: String(form.get('note') || '').trim(), closedAt: Date.now(), reopened: false };
  if (tomorrow && form.get('plan')) {
    const nextDay = addDays(day, 1); let task = state.tasks.find(t => t.id === record.tomorrowTaskId);
    if (task && !done(task)) { task.title = tomorrow; task.step = tomorrow; task.scheduled = nextDay; task.deleted = false; }
    else if (!task) {
      const id = uid(); task = { id, seriesId: id, title: tomorrow, step: tomorrow, condition: '', minutes: 25, energy: 2, autoEnergy: true, repeat: 'none', occurrence: nextDay, scheduled: nextDay, due: '', priority: 2, project: '', createdAt: Date.now(), firstStart: null, importedDone: false, deleted: false };
      state.tasks.push(task); record.tomorrowTaskId = id;
    }
    if (task && !done(task)) state.main[nextDay] = task.id;
  }
  state.daily[day] = record;
  save(); $('endDialog').close(); clearAnimation(); lastResultSession = null; render();

});
function exportSave() {
  EmberStorage.download('emberquest-save-' + today() + '.json', EmberStorage.serialize(state), 'application/json');
  toast('JSONバックアップを書き出しました。');
}
$('importFile').addEventListener('change', async event => {
  const file = event.target.files[0]; event.target.value = '';
  if (!file) return;
  if (file.size > 20 * 1024 * 1024) { toast('20MB以下のJSONバックアップを選んでください。'); return; }
  try {
    const next = EmberStorage.parse(await file.text());
    confirmAction('バックアップから復元しますか？', next.tasks.filter(t => !t.deleted).length + '件の任務を読み込み、現在の進捗を置き換えます。必要なら先にJSONを書き出してください。', () => {
      clearAnimation(); state = next; lastResultSession = null; lastForge = null; refreshRecurrence(); game = replay(state); selectedWeapon = game.equipped;
      save(); render(); toast('任務・装備・遠征の記録を復元しました。');
    });
  } catch (error) { toast('復元できません：' + error.message); }
});
$('confirmNo').onclick = () => { confirmCallback = null; $('confirmDialog').close(); };
$('confirmYes').onclick = () => { const callback = confirmCallback; confirmCallback = null; $('confirmDialog').close(); callback?.(); };
$('confirmDialog').addEventListener('cancel', () => { confirmCallback = null; });

document.addEventListener('click', event => {
  const button = event.target.closest('[data-action]');
  if (!button || button.disabled) return;
  const action = button.dataset.action, id = button.dataset.id, task = state.tasks.find(t => t.id === id);
  switch (action) {
    case 'nav': navigate(button.dataset.view); break;
    case 'add': openTask(); break;
    case 'edit': openTask(id); break;
    case 'template': templateTask(button.dataset.template); break;
    case 'close-task': $('taskDialog').close(); break;
    case 'main':
      if (task && !done(task) && !superseded(task)) { state.main[today()] = id; task.scheduled = today(); if (state.daily[today()]) state.daily[today()].reopened = true; save(); render(); toast('今日の主目標に選びました。'); }
      break;
    case 'unmain': delete state.main[today()]; save(); render(); break;
    case 'start': startTask(id); break;
    case 'leave-focus': leaveFocus(); break;
    case 'toggle-timer': if (focus) { focus.showTimer = !focus.showTimer; renderFocus(); } break;
    case 'timer':
      if (!focus) break;
      if (focus.running) { focus.remaining = remaining(); focus.running = false; }
      else { if (focus.remaining <= 0) focus.remaining = (state.tasks.find(t => t.id === focus.taskId)?.minutes || 25) * 60000; focus.endAt = Date.now() + focus.remaining; focus.running = true; }
      renderFocus(); break;
    case 'complete': completeTask(id); break;
    case 'undo': undoTask(id); break;
    case 'archive':
      if (task) { task.deleted = true; if (state.main[today()] === id) delete state.main[today()]; save(); render(); toast(task.repeat === 'none' ? '任務を保管しました。拠点から戻せます。' : '任務を保管し、今後の繰り返しを止めました。'); }
      break;
    case 'restore-task': if (task) { task.deleted = false; refreshRecurrence(); save(); render(); } break;
    case 'filter': filter = button.dataset.filter; showAll = false; renderHome(); break;
    case 'show-all': showAll = true; renderHome(); break;
    case 'route': state.route = button.dataset.route; save(); render(); break;
    case 'region':
      if (Number(button.dataset.region) <= game.unlocked) { clearAnimation(); state.region = Number(button.dataset.region); save(); render(); sound('victory'); toast(REGIONS[state.region].name + 'を次の進路に選びました。'); }
      break;
    case 'select-weapon': selectedWeapon = button.dataset.weapon; renderEquipment(); break;
    case 'forge': forge(button.dataset.weapon); break;
    case 'equip':
      if (game.tiers[button.dataset.weapon] >= 0) { state.events.push({ id: uid(), type: 'equip', weapon: button.dataset.weapon, day: today(), at: Date.now() }); save(); render(); sound('forge'); toast('装備を変更しました。次の一撃から反映されます。'); }
      break;
    case 'mute': state.settings.mute = !state.settings.mute; save(); render(); if (!state.settings.mute) sound('forge'); break;
    case 'end-day': openEndDay(); break;
    case 'close-end': $('endDialog').close(); break;
    case 'export': exportSave(); break;
    case 'import': $('importFile').click(); break;
  }

document.addEventListener('change', event => {
  if (event.target.id === 'soundSetting') { state.settings.mute = !event.target.checked; save(); render(); sound('forge'); }
  if (event.target.id === 'volumeSetting') { state.settings.volume = Number(event.target.value); save(); sound('forge'); }
  if (event.target.id === 'motionSetting') { state.settings.reduced = event.target.checked; clearAnimation(); save(); render(); }
});
document.addEventListener('submit', event => {
  if (event.target.id !== 'feedbackForm') return;
  event.preventDefault(); const data = new FormData(event.target);
  state.feedback.push({ day: today(), reward: Number(data.get('reward')), entry: Number(data.get('entry')), note: String(data.get('note') || '').slice(0,1000) });
  save(); render(); toast('振り返りを残しました。');
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && focus) leaveFocus();
  if (event.key === 'Tab' && focus) {
    const controls = [...$('focusOverlay').querySelectorAll('button:not(:disabled)')].filter(b => b.getClientRects().length);
    const first = controls[0], last = controls.at(-1);

function refreshDay() {
  if (today() !== lastDay) {
    lastDay = today(); refreshRecurrence();
    if (!focus) render();
  }
}
setInterval(refreshDay, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { updateTimer(); refreshDay(); } });
refreshRecurrence(); render();
if (loaded.notice) toast(loaded.notice);
