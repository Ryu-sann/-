<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="現実の一歩で剣を鍛え、闇に道を開く。任務を果たして冒険を進めるRPG。">
  <title>EMBERQUEST — 灰の旅人</title>
  <style>
:root {
  --bg:#101114; --panel:#1a1e23; --panel2:#20252b; --text:#e8e3d9; --muted:#a3aab2;
  --line:#30353b; --ember:#d97a42; --gold:#cbb381; --red:#a44952; --ok:#a9c08f;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  color:var(--text); background:var(--bg); color-scheme:dark; font-synthesis:none;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); }
button,input,textarea,select { font:inherit; }
button { color:inherit; border:0; background:none; cursor:pointer; }
button:disabled { opacity:.4; cursor:default; }
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible { outline:2px solid var(--ember); outline-offset:3px; }
svg { vertical-align:middle; flex-shrink:0; }
h1,h2,h3,p { margin:0; }
h1,h2,.serif { font-family:'Iowan Old Style','Palatino Linotype','Hiragino Mincho ProN','Yu Mincho',serif; font-weight:400; }
h1,h2,h3,.stepbox,.source,.first-step,.t { overflow-wrap:anywhere; }

/* header & nav */
header { max-width:1200px; margin:auto; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; gap:16px; border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:10px; font:16px Georgia,serif; letter-spacing:3px; }
.brand svg { color:#e49a63; }
.header-stats { display:flex; align-items:center; gap:14px; font-size:12px; color:#c8c9c7; font-variant-numeric:tabular-nums; }
.header-stats>span { display:inline-flex; align-items:center; gap:4px; }
.header-stats .off { font-size:9px; margin-left:3px; }
.shell { max-width:1200px; margin:auto; padding:18px 20px 110px; }
.page { display:none; }
.page.active { display:block; }
.bottomnav { position:fixed; z-index:20; bottom:0; left:0; right:0; background:#13171df5; backdrop-filter:blur(16px); border-top:1px solid var(--line); display:flex; justify-content:center; gap:24px; padding:6px 8px max(8px,env(safe-area-inset-bottom)); }
.bottomnav button { position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; width:72px; font-size:10px; color:#a5abb0; padding:6px 2px; }
.bottomnav button.active { color:#e6a16c; }
.bottomnav button.active:before { content:''; position:absolute; top:-7px; width:28px; height:2px; background:var(--ember); }

/* common */
.panel { padding:18px; background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:16px; }
.panel h2 { font-size:18px; margin-bottom:12px; }
.page-title { margin:2px 0 18px; }
.page-title h1 { font-size:26px; letter-spacing:2px; margin-bottom:6px; }
.page-title p { font-size:12px; color:var(--muted); line-height:1.8; }
.sub-head { font-size:16px; margin:22px 0 10px; }
.between { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.flex { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.center { text-align:center; }
.gold { color:var(--gold); }
.orange { color:#efa573; }
.muted { color:var(--muted); }
.ok { color:var(--ok); }
.tiny { font-size:11px; line-height:1.8; }
.bar { height:5px; background:#0e1217; overflow:hidden; border-radius:3px; }
.bar>span { display:block; height:100%; background:var(--red); transition:width .55s; }
.bar.exp>span { background:var(--gold); }
.bar.muted-bar>span { background:#6f6858; }
.tag { display:inline-flex; align-items:center; gap:4px; font-size:10px; padding:2px 6px; border:1px solid #4b4c46; color:#bfc3c1; border-radius:3px; font-family:sans-serif; }
.primary { display:inline-flex; justify-content:center; align-items:center; gap:8px; padding:12px 18px; color:#fff2e2; background:#c66e3f; border:1px solid #df8c57; border-radius:6px; font-size:13px; }
.primary:hover { background:#db8552; }
.secondary { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid #4f5450; padding:11px 14px; border-radius:6px; background:var(--panel2); font-size:13px; }
.secondary:hover { border-color:#9d8663; }
.secondary.small { padding:6px 10px; font-size:12px; white-space:nowrap; }
.full { width:100%; }
.ghost { display:inline-flex; align-items:center; justify-content:center; gap:6px; color:var(--muted); font-size:12px; padding:7px; }
.ghost:hover { color:var(--text); }
.iconbtn { padding:7px; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); border-radius:6px; }
.iconbtn:hover { background:#ffffff0b; color:#e0c392; }
.section-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:10px; }
.section-head h2 { margin:0; }
.empty { text-align:center; padding:20px 14px; font-size:12px; color:#a7adb2; line-height:1.9; border:1px dashed #44463f; border-radius:6px; }
.segmented { display:inline-flex; background:#15191e; border:1px solid var(--line); border-radius:7px; padding:2px; gap:2px; }
.segmented button { font-size:12px; color:var(--muted); padding:6px 11px; border-radius:5px; }
.segmented button.active { color:#f0d9ad; background:#353128; }
.segmented.wide { display:flex; margin-bottom:14px; }
.segmented.wide button { flex:1; padding:9px 6px; }

/* scene */
.home-grid { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(340px,1fr); gap:20px; align-items:start; }
.visual-col,.action-col { min-width:0; }
.scene { height:380px; position:relative; overflow:hidden; border:1px solid #47433c; border-radius:8px; background:#111a24; }
.scene>svg { display:block; width:100%; height:100%; }
.scene:after { content:''; position:absolute; inset:0; background:linear-gradient(0deg,#080c13ee,transparent 35%,transparent 78%,#0b101655); pointer-events:none; }
.scene.boss-phase-2 { border-color:#8a3c2c; box-shadow:0 0 24px #c2412c33; }
.scenetop { position:absolute; z-index:2; left:14px; right:14px; top:12px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#d0cabe; }
.scene-tag { padding:4px 8px; background:#121820c8; border:1px solid #6d604d; border-radius:4px; }
.scene-caption { position:absolute; left:14px; right:14px; bottom:12px; z-index:2; }
.boss-row { display:flex; justify-content:space-between; gap:10px; font-size:12px; color:#e0d2c6; margin-bottom:6px; font-variant-numeric:tabular-nums; }
.phase { font-style:normal; margin-left:8px; font-size:10px; padding:1px 6px; border-radius:3px; border:1px solid #8a5a3c; color:#f2b47c; }
.boss-phase-2 .phase { border-color:#c2412c; color:#ff9a7a; }

/* today */
.progress-card { padding:12px 14px; background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:12px; }
.progress-card strong { font-size:15px; font-weight:500; }
.progress-card .bar { margin-top:9px; }
.main-task { padding:18px; background:linear-gradient(140deg,#3b2c1e40,var(--panel)); border:1px solid #7d6040; border-radius:8px; margin-bottom:6px; }
.main-task.quiet { background:var(--panel); border-color:var(--line); }
.main-label { font-size:11px; color:#d4b27e; display:flex; align-items:center; gap:6px; }
.main-task h2 { font:500 19px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','Yu Gothic',sans-serif; margin:8px 0 6px; }
.main-task .quiet h2, .main-task.quiet h2 { margin-bottom:12px; }
.main-task .meta { color:var(--muted); font-size:11px; display:flex; gap:8px; flex-wrap:wrap; }
.stepbox { border-left:2px solid #b76e43; margin:12px 0 0; padding-left:10px; font-size:13px; color:#d9d3c7; line-height:1.8; }
.condition { font-size:12px; line-height:1.8; color:#bcc0c1; margin:8px 0 2px; }
.forecast { display:flex; gap:8px; align-items:flex-start; margin:12px 0 0; padding:10px 12px; background:#24221d; border:1px solid #423d33; border-radius:6px; font-size:12px; line-height:1.7; color:#e6ce9d; }
.forecast svg { margin-top:3px; color:#c69c62; }
.forecast .muted { font-size:11px; }
.main-actions { display:grid; grid-template-columns:1fr auto; gap:8px; margin-top:14px; }
.inline-result { margin:0 0 12px; padding:12px 14px; border:1px solid #6b593e; background:linear-gradient(135deg,#332b1c,var(--panel)); border-radius:8px; }
.inline-result h3 { font:16px/1.6 serif; font-weight:400; color:#f0d6a6; }
.inline-result .source { font-size:12px; line-height:1.7; color:#c4c6c0; margin-top:4px; }
.inline-result .gains { color:#e5c183; font-size:12px; margin-top:4px; }
.task-section { margin-top:18px; }
.task-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
.task-row .body { flex:1; min-width:0; text-align:left; padding:2px 0; display:block; }
.task-row .t { display:block; font-size:14px; line-height:1.6; }
.task-row .meta { color:var(--muted); font-size:11px; display:flex; gap:8px; flex-wrap:wrap; margin-top:2px; }
.task-row.done .t { color:#8f9696; text-decoration:line-through; }
.task-row.past { opacity:.6; }
.task-row.is-main .t { color:#f0d6a6; }
.checkbtn { border:1.5px solid #6a7271; border-radius:50%; width:26px; height:26px; min-width:26px; display:grid; place-items:center; padding:0; }
.checkbtn:hover:not(:disabled) { color:var(--ember); border-color:var(--ember); }
.done .checkbtn { color:#cfe0b5; background:#45523a; border-color:#66764f; }
.goal-suggest { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:14px; }
.goal-suggest>span { width:100%; }
.chip { display:inline-flex; align-items:center; gap:4px; padding:6px 10px; border:1px solid #5e5542; background:#28251f; color:#e2c998; border-radius:999px; font-size:12px; }
.chip small { color:var(--muted); }
.end-link { margin-top:18px; padding-top:10px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; }

/* week */
.week-strip { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:16px; }
.week-strip>div { text-align:center; padding:8px 0; border:1px solid var(--line); border-radius:8px; background:var(--panel); font-variant-numeric:tabular-nums; }
.week-strip small { display:block; font-size:10px; color:var(--muted); }
.week-strip b { display:block; font:17px Georgia,serif; margin:2px 0; }
.week-strip span { display:block; font-size:11px; color:var(--gold); min-height:16px; }
.week-strip .today { border-color:#c3945e; background:#2b2620; }
.week-strip .past b { color:#9aa0a3; }
.week-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
.week-grid .panel { margin:0; }
.goal-row { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
.goal-row:last-child { border:0; }
.goal-row .body { flex:1; min-width:0; }
.goal-row h3 { font-size:14px; font-weight:500; line-height:1.6; }
.goal-row.done h3 { color:#a7b39a; }
.pips { display:flex; align-items:center; gap:4px; margin-top:4px; flex-wrap:wrap; }
.pips i { width:12px; height:12px; border-radius:50%; border:1.5px solid #6b6455; }
.pips i.on { background:var(--gold); border-color:var(--gold); }
.pips span { margin-left:6px; }

/* adventure */
.roadmap { display:flex; padding:4px 0 16px; border-bottom:1px solid var(--line); }
.roadstop { flex:1; position:relative; text-align:center; font-size:11px; color:#9ca5ab; line-height:1.8; }
.roadstop:before { content:''; position:absolute; height:1px; background:#4b4d4c; top:13px; left:0; right:0; }
.roadstop:first-child:before { left:50%; }
.roadstop:last-child:before { right:50%; }
.roadstop>span { position:relative; display:grid; place-items:center; width:27px; height:27px; margin:auto auto 6px; border:1px solid #4b504e; background:#1b2026; border-radius:50%; }
.roadstop.done>span { background:#7c6948; color:#e8d9bd; }
.roadstop.active { color:#e5cc9b; }
.roadstop.active>span { border-color:#c3945e; box-shadow:0 0 15px #e5af5830; }
.encounter-list { margin:6px 0 12px; }
.encounter-row { padding:12px 0; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:16px; }
.encounter-row>div { flex:1; min-width:0; }
.encounter-row h3 { font-size:14px; font-weight:400; margin-bottom:3px; }
.encounter-row .bar { margin-top:6px; }
.route-options { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.route { padding:14px; border:1px solid #42484a; border-radius:8px; text-align:left; display:flex; align-items:center; gap:10px; background:var(--panel); }
.route.active { border-color:#a88b5a; background:#2c2821; }
.route strong { display:block; font-size:13px; font-weight:500; }
.route p { font-size:11px; color:var(--muted); margin-top:2px; }
.region-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.region-card { text-align:left; padding:14px; background:var(--panel); border:1px solid var(--line); border-radius:8px; display:flex; flex-direction:column; gap:4px; }
.region-card strong { font:19px serif; font-weight:400; }
.region-card.selected { border-color:#92764f; opacity:1; }
.region-card:disabled.selected { opacity:1; }

/* equipment */
.equipment-grid { display:grid; grid-template-columns:1fr 1.1fr; gap:20px; align-items:start; }
.portrait { text-align:center; padding:18px; background:radial-gradient(ellipse at 50% 35%,#66564560,transparent 60%),#171d24; border:1px solid #4d463b; border-radius:8px; }
.portrait .fullbody { height:360px; width:100%; display:block; }
.portrait .fullbody .knight { filter:drop-shadow(-3px -1px 3px #c5a26b40); }
.statrow { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:#3d4347; border:1px solid #3d4347; border-radius:6px; overflow:hidden; margin-top:12px; }
.statrow>div { padding:12px 6px; background:#1b2128; font-size:11px; color:var(--muted); }
.statrow b { display:block; color:#d0b37a; font:22px Georgia,serif; margin-bottom:4px; }
.weapon-panel { padding:16px; }
.forge-preview { margin:0 0 10px; display:grid; grid-template-columns:1fr 24px 1fr; align-items:center; gap:8px; }
.preview-person { text-align:center; min-width:0; }
.preview-person>svg { height:170px; width:100%; display:block; }
.preview-person strong { display:block; font-size:12px; font-weight:400; color:#ded1b7; line-height:1.7; }
.preview-person small { display:block; color:var(--muted); font-size:10px; }
.preview-person.after { border:1px solid #705b3d; background:radial-gradient(ellipse at center,#90633122,transparent 70%); padding:8px 4px; border-radius:6px; }
.costrow { padding:12px 0; margin-top:8px; border-top:1px solid var(--line); display:flex; justify-content:space-between; font-size:13px; color:#d7c295; }
.milestone { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted); }
.milestone:last-child { border:0; }
.milestone>span { min-width:34px; text-align:center; font:13px Georgia,serif; padding:2px 0; border-radius:4px; border:1px solid #4b504e; }
.milestone small { margin-left:auto; color:var(--gold); font-size:11px; }
.milestone.reached { color:var(--text); }
.milestone.reached>span { background:#7c6948; border-color:#7c6948; color:#f3e3c3; }
.milestone.next { color:#f0d6a6; }
.milestone.next>span { border-color:#c3945e; }

/* records */
.camp-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
.metrics { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.metric { padding:12px; background:#161b21; border:1px solid var(--line); border-radius:6px; color:var(--muted); font-size:11px; line-height:1.7; }
.metric b { display:block; color:#dec292; font:22px Georgia,serif; margin-bottom:2px; }
.daily-record { padding:10px 0; border-bottom:1px solid var(--line); }
.daily-record:last-child { border:0; }
.daily-record h3 { font-size:13px; font-weight:500; margin-bottom:4px; }
.daily-record p { font-size:12px; line-height:1.8; color:var(--muted); }
.daily-record .bar { margin-top:8px; }
details.panel>summary { font-size:14px; color:#e0cfa9; padding:0; margin:0; list-style-position:inside; }
details.panel[open]>summary { margin-bottom:10px; }
.history { max-height:420px; overflow:auto; }
.history>div { padding:9px 0; border-bottom:1px solid var(--line); font-size:12px; line-height:1.8; overflow-wrap:anywhere; }
.setting { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); gap:16px; font-size:13px; }
input[type=checkbox] { accent-color:var(--ember); width:18px; height:18px; }
input[type=range] { accent-color:var(--ember); width:110px; }
.summary-part { margin:16px 0; padding-bottom:12px; border-bottom:1px solid var(--line); }
.summary-part h3 { font-size:12px; color:#cbb386; font-weight:500; margin-bottom:8px; }
.summary-part ul { padding-left:18px; margin:0; font-size:13px; line-height:1.9; color:#d2d4ce; }
.inline-check { display:flex; align-items:center; gap:8px; font-size:12px; color:#c9c9bf; margin:14px 0; }

/* dialogs */
dialog { width:480px; max-width:94vw; max-height:90dvh; background:#1c2228; color:var(--text); border:1px solid #5f5544; border-radius:12px; padding:22px; box-shadow:0 20px 100px #000c; }
dialog::backdrop { background:#070b10d9; backdrop-filter:blur(6px); }
dialog h2 { font-size:21px; letter-spacing:1px; }
dialog.sheet h2 { font:500 15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','Yu Gothic',sans-serif; letter-spacing:0; }
.menu-items { margin-top:8px; display:flex; flex-direction:column; }
.menu-item { display:flex; align-items:center; gap:12px; text-align:left; padding:12px 6px; border-bottom:1px solid var(--line); font-size:14px; }
.menu-item:last-child { border:0; }
.menu-item small { display:block; font-size:11px; color:var(--muted); margin-top:1px; }
.menu-item svg { color:var(--gold); }
.menu-item.danger, .menu-item.danger svg { color:#e2a8aa; }
.menu-item:hover { background:#ffffff08; }
label.field { display:block; font-size:12px; color:#c9c9bf; margin:14px 0 6px; }
input:not([type=checkbox]):not([type=range]),textarea,select { width:100%; padding:11px; border:1px solid #4c5359; background:#131a21; color:#e5e4dc; font-size:14px; border-radius:6px; }
input::placeholder,textarea::placeholder { color:#8e979e; }
textarea { min-height:65px; resize:vertical; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
.templates { display:flex; gap:6px; flex-wrap:wrap; margin:14px 0 2px; }
.templates button { border:1px solid #695c45; background:#302a21; color:#d7bb8a; padding:6px 10px; font-size:12px; border-radius:999px; }
details { margin:14px 0; }
summary { cursor:pointer; color:#d1b37d; font-size:12px; line-height:1.9; padding:6px 0; }
.dialogactions { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:20px; }

/* focus */
.focus-overlay { position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 90%,#54321f44,transparent 60%),#101114; padding:24px; overflow:auto; }
.focus-overlay.visible { display:flex; }
.focus-leave { position:absolute; right:16px; top:16px; }
.focus-inner { width:100%; max-width:520px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; }
.focus-inner h2 { font-size:26px; line-height:1.7; margin:14px 0 4px; }
.first-step { width:100%; padding:16px; border-top:1px solid #4e473d; border-bottom:1px solid #4e473d; font-size:15px; color:#d7c8ab; line-height:1.9; margin:10px 0; }
.focus-inner p { color:#b8c0c2; font-size:12px; line-height:1.9; }
.timer { font:60px Georgia,serif; letter-spacing:3px; margin:12px 0 10px; color:#e4c9a2; font-variant-numeric:tabular-nums; }
.focus-inner .primary { margin-top:16px; width:100%; padding:15px; font-size:14px; }
.focus-note { font-size:11px!important; margin-top:8px; }

.toast { position:fixed; bottom:86px; left:50%; transform:translateX(-50%); width:max-content; max-width:92vw; z-index:80; border:1px solid #95805e; border-radius:8px; background:#2a2b27; color:#ebd5ad; padding:11px 16px; font-size:13px; line-height:1.7; box-shadow:0 10px 30px #0009; }
.hidden { display:none!important; }

/* battle animation */
.animation-message { position:absolute; inset:38% 16px auto; text-align:center; color:#f4c486; font:22px serif; letter-spacing:1px; text-shadow:0 3px 16px #000; z-index:4; pointer-events:none; }
.damage-number { position:absolute; left:68%; top:30%; color:#ffe2b1; font:30px Georgia,serif; opacity:0; z-index:5; text-shadow:0 2px 8px #000; }
.scene.striking .damage-number { animation:damage .9s .45s ease-out; }
.slash { opacity:0; stroke-dasharray:500; stroke-dashoffset:500; }
.scene.striking .slash { animation:slash .7s .35s ease-out; }
.scene.striking:not(.dual) .slash.second { display:none; }
.scene.striking.dual .slash { animation:slash .4s .15s ease-out 3; }

.scene.striking .hero-stage { animation:lunge .8s ease-in-out; }
.scene.striking .blade { animation:swing .8s ease-in-out; transform-origin:155px 115px; }
.scene.striking .enemy-figure { animation:hit .5s .6s ease-out; }
.scene.striking.dual .enemy-figure { animation:hit .4s .25s 3 ease-out; }
.scene .embers { animation:embers 7s infinite ease-in-out; }
.scene .rays { animation:rays 3s infinite alternate ease-in-out; }
.scene .mist { animation:mist 15s infinite alternate ease-in-out; }
.enemy-figure.phase-2 .cracks { animation:pulse 1.6s infinite alternate; }
.knight .halo { animation:pulse 3s infinite alternate; }
.flame { animation:flame 1.7s infinite alternate; transform-origin:50% 90%; }
.scene .cloak { animation:cloak 7s infinite alternate; transform-origin:100px 90px; }
.after-forge .fullbody { animation:forged 1.6s ease-out; }
.reduced *, .reduced *:before, .reduced *:after { animation:none!important; transition:none!important; }
@keyframes slash { 10%{opacity:1}70%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0} }
@keyframes lunge { 45%{transform:translate(125px,99px) scale(1.18)} }
@keyframes swing { 40%{transform:rotate(13deg)}65%{transform:rotate(-18deg)} }
@keyframes hit { 35%{filter:brightness(1.9);transform:translateX(7px)} }

  <script>
/* Deterministic game model. Replaying the journal makes undo safe for rewards,
   boss damage, upgrades and unlocks. No reward depends on animation timers. */
(function(root){
'use strict';
const REGIONS=[
 {name:'灰の城門',sub:'第一章',enemy:'城門の番人',goal:'閉ざされた門を開き、最初の烽火を灯せ。',distance:12,hp:100,iron:1,x:0},
 {name:'沈黙の聖堂',sub:'第二章',enemy:'鐘楼の亡霊',goal:'崩れた聖堂に響く、最後の鐘を取り戻せ。',distance:18,hp:210,iron:1,x:1},
 {name:'黎明の断崖',sub:'第三章',enemy:'翼なき王',goal:'夜の果てで、失われた夜明けを取り戻せ。',distance:24,hp:360,iron:2,x:2}
];
const WEAPONS=[
 {id:'worn',name:'煤けた大剣',power:0,cost:0,ember:0,shape:0,description:'傷はある。まだ、折れてはいない。'},
 {id:'iron',name:'黒鉄の大剣',power:9,cost:8,ember:0,shape:1,description:'幾度もの行動を、一振りの鋼に。'},
 {id:'oath',name:'誓火の双剣',power:16,cost:18,ember:3,shape:2,description:'一歩を重ねる者の、二つの誓い。'},
 {id:'dawn',name:'黎明の断剣',power:28,cost:30,ember:6,shape:3,description:'砕けた世界にも、朝は来る。'}
];
function fresh(){return {version:3,tasks:[],events:[],main:{},route:'story',region:0,view:'tasks',focus:null,settings:{mute:true,volume:.25,reduced:false},base:{xp:0,iron:0,ember:0,unlocked:0,progress:[0,0,0],hp:[100,210,360],owned:['worn'],equipped:'worn'},createdAt:Date.now()}}
function replay(s){
 const b=s.base,g={xp:b.xp||0,iron:b.iron||0,ember:b.ember||0,progress:[...b.progress],hp:[...b.hp],unlocked:b.unlocked||0,owned:[...b.owned],equipped:b.equipped||'worn',done:new Set(),results:[],invalid:[],mainDays:new Set(),titles:[],forged:0};
 for(const a of s.events){
 if(a.type==='forge'){const w=WEAPONS.find(w=>w.id===a.weapon);if(w&&!g.owned.includes(w.id)&&g.iron>=w.cost&&g.ember>=w.ember){g.iron-=w.cost;g.ember-=w.ember;g.owned.push(w.id);g.equipped=w.id;g.forged++}else g.invalid.push(a.id);continue}
 if(a.type==='equip'){if(g.owned.includes(a.weapon))g.equipped=a.weapon;continue}
 if(a.type!=='complete'||g.done.has(a.taskId))continue;
 g.done.add(a.taskId);let region=Math.min(a.region,g.unlocked,2),r=REGIONS[region],cleared=g.hp[region]<=0&&g.progress[region]>=r.distance,level=1+Math.floor(g.xp/40),w=WEAPONS.find(w=>w.id===g.equipped)||WEAPONS[0];
 let main=a.main&&!g.mainDays.has(a.day);if(main)g.mainDays.add(a.day);
 const energy=a.energy,iron=energy*(a.route==='materials'?2:1)+r.iron-1+(main?2:0),xp=energy*(cleared?4:8),ember=main?1:0;
 const damage=cleared?0:Math.round((12+level*3+w.power)*energy*(a.route==='materials'?.65:1));
 let actual=Math.min(g.hp[region],damage);g.hp[region]=Math.max(0,g.hp[region]-damage);let before=g.progress[region];g.progress[region]=Math.min(r.distance,before+(a.route==='materials'?Math.max(1,Math.floor(energy/2)):energy));
 let cache=before<6&&g.progress[region]>=6&&!cleared;g.iron+=iron+(cache?2:0);g.ember+=ember;g.xp+=xp;
 let victory=!cleared&&g.hp[region]===0&&g.progress[region]>=r.distance;
 if(victory){g.ember+=2;g.unlocked=Math.max(g.unlocked,Math.min(2,region+1));g.titles.push(['城門を開く者','鐘を継ぐ者','夜明けを呼ぶ者'][region])}
 g.results.push({eventId:a.id,taskId:a.taskId,title:a.title,day:a.day,at:a.at,region,route:a.route,iron:iron+(cache?2:0),ember:ember+(victory?2:0),xp,damage:actual,main,cache,victory,repeat:cleared,weapon:w.id,level:1+Math.floor(g.xp/40)});
 }
 g.level=1+Math.floor(g.xp/40);g.attack=12+g.level*3+(WEAPONS.find(w=>w.id===g.equipped)||WEAPONS[0]).power;
 g.projects=[...new Set(s.tasks.map(t=>t.project).filter(Boolean))].map(name=>{const ts=s.tasks.filter(t=>t.project===name&&!t.deleted);return {name,total:ts.length,done:ts.filter(t=>t.importedDone||g.done.has(t.id)).length}}).filter(p=>p.total);

}
function migrate(old){const s=fresh();if(!old||!Array.isArray(old.tasks))return s;s.tasks=old.tasks.map(t=>({id:String(t.id),title:String(t.title).slice(0,100),energy:[1,2,4].includes(Number(t.size))?Number(t.size):2,condition:'',step:'',minutes:25,due:'',scheduled:t.done?(t.date||''):localDay(),priority:2,project:'',createdAt:Date.now(),importedDone:!!t.done,deleted:false}));s.base.xp=Math.max(0,Number(old.xp)||0);s.base.iron=Math.max(0,Number(old.total)||0);s.base.unlocked=Math.min(2,Math.max(0,(old.regions?.length||1)-1));s.region=Math.min(old.region||0,s.base.unlocked);if(old.weapon>0){s.base.owned.push('iron');s.base.equipped='iron'};old.regions?.slice(0,3).forEach((r,i)=>{s.base.progress[i]=Math.min(REGIONS[i].distance,Math.round(Math.min(r.p,10)*REGIONS[i].distance/10));s.base.hp[i]=r.hp<=0?0:Math.round(REGIONS[i].hp*Math.min(20,r.hp)/20)});s.legacyLogs=Array.isArray(old.logs)?old.logs.slice(0,40).map(String):[];if(old.pending?.energy>0){s.base.xp+=old.pending.energy*5;s.base.iron+=old.pending.energy;}s.migrated=true;return s}
function localDay(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function validate(s){
 if(!s||s.version!==3||!Array.isArray(s.tasks)||!Array.isArray(s.events)||s.tasks.length>10000||s.events.length>50000)throw Error('対応するバックアップではありません。');
 const str=(v,n=500)=>typeof v==='string'&&v.length<=n,num=(v,min,max)=>Number.isFinite(v)&&v>=min&&v<=max;
 if(!s.base||!Array.isArray(s.base.progress)||s.base.progress.length!==3||!Array.isArray(s.base.hp)||s.base.hp.length!==3||!Array.isArray(s.base.owned)||!s.base.owned.every(w=>WEAPONS.some(x=>x.id===w))||!num(s.base.xp,0,1e9)||!num(s.base.iron,0,1e9)||!num(s.base.ember,0,1e9)||(!num(s.base.unlocked,0,2)||!Number.isInteger(s.base.unlocked))||!s.base.progress.every((p,i)=>num(p,0,REGIONS[i].distance))||!s.base.hp.every((p,i)=>num(p,0,REGIONS[i].hp)))throw Error('成長データが壊れています。');
 if(!s.base.owned.includes('worn')||!s.base.owned.includes(s.base.equipped))throw Error('装備データが壊れています。');
 const ids=new Set();for(const t of s.tasks){if(!str(t.id,100)||ids.has(t.id)||!str(t.title,100)||!t.title.trim()||![1,2,4].includes(t.energy)||!str(t.condition)||!str(t.step)||!str(t.due,10)||!str(t.scheduled,10)||!str(t.project,80)||!num(t.minutes,1,240)||![1,2,3].includes(t.priority)||!num(t.createdAt,0,1e14))throw Error('任務データが壊れています。');ids.add(t.id)}
 for(const a of s.events){if(!str(a.id,100)||!['complete','forge','equip'].includes(a.type))throw Error('履歴データが壊れています。');if(a.type==='complete'&&(!ids.has(a.taskId)||![1,2,4].includes(a.energy)||(!num(a.region,0,2)||!Number.isInteger(a.region))||!['story','materials'].includes(a.route)||!str(a.title,100)||!str(a.day,10)||!num(a.at,0,1e14)))throw Error('達成履歴が壊れています。');if(a.type!=='complete'&&!WEAPONS.some(w=>w.id===a.weapon))throw Error('装備データが壊れています。')}
 if(!s.main||typeof s.main!=='object'||Array.isArray(s.main)||!s.settings||typeof s.settings.mute!=='boolean'||typeof s.settings.reduced!=='boolean'||!num(s.settings.volume,0,1)||(!num(s.region,0,2)||!Number.isInteger(s.region))||!['story','materials'].includes(s.route))throw Error('設定データが壊れています。');
 if(s.feedback!==undefined&&(!Array.isArray(s.feedback)||s.feedback.length>10000||!s.feedback.every(f=>str(f.day,10)&&num(f.reward,1,5)&&num(f.entry,1,5)&&str(f.note,1000))))throw Error('振り返りデータが壊れています。');
 if(s.legacyLogs!==undefined&&(!Array.isArray(s.legacyLogs)||!s.legacyLogs.every(l=>str(l,2000))))throw Error('以前の記録が壊れています。');
 s.focus=null;s.view='tasks';return s
}
root.EmberLegacy={REGIONS,WEAPONS,fresh,replay,migrate,localDay,validate};
})(typeof module==='object'?module.exports:window);

}

/* ---------- render ---------- */
function render() {

  $('headerStats').innerHTML = `<span>Lv.${game.level}</span>
    <span class="gold" title="鉄片">${icon('hammer', 14)}${game.iron}</span>
    <span class="orange" title="熾火">${icon('fire', 14)}${game.ember}</span>
    <button class="iconbtn" data-action="mute" aria-label="${state.settings.mute ? '音をオンにする' : '音をミュートする'}">${icon('volume', 15)}${state.settings.mute ? '<span class="off">OFF</span>' : ''}</button>`;
  renderToday(); renderWeek(); renderAdventure(); renderEquipment(); renderCamp();
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + view));
  document.querySelectorAll('[data-action=nav]').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  fillIcons();
}
function sceneBlock(displayGame = game) {
  const i = state.region, r = REGIONS[i], e = currentEncounter(displayGame, i);
  const isFight = ['combat', 'boss'].includes(e.kind), phase = e.kind === 'boss' ? bossPhase(e.hp, e.maxHp) : -1;
  return `<div class="scene ${phase >= 0 ? 'boss-phase-' + phase : ''}" id="battleScene">
    ${sceneArt(i, displayGame.equipped, displayGame.tiers[displayGame.equipped], displayGame)}
    <div class="scenetop"><span class="scene-tag">${r.sub} ${esc(r.name)}</span><span>${e.kind === 'repeat' ? '踏破済み' : esc(e.name) + ' ' + (e.index + 1) + '/4'}</span></div>
    <div class="scene-caption"><div class="boss-row"><span>${esc(e.enemy || '素材を集める')}${phase >= 0 ? `<em class="phase">${PHASES[phase]}</em>` : ''}</span><span id="sceneHp">${isFight ? e.hp + ' / ' + e.maxHp : e.kind === 'cache' ? '次の任務で回収' : ''}</span></div>
      <div class="bar ${isFight ? '' : 'muted-bar'}"><span id="sceneBar" style="width:${isFight ? e.hp / e.maxHp * 100 : 100}%"></span></div></div>
    <div id="animationMessage" class="animation-message hidden" aria-live="polite"></div><div id="damageNumber" class="damage-number"></div>
  </div>`;
}
function tagsFor(t) {
  const complete = done(t), goal = goalOf(t), tags = [`<span>${t.minutes}分</span>`];
  if (t.repeat !== 'none') tags.push(`<span>${repeatLabel(t)}</span>`);
  if (goal) tags.push(`<span class="gold">週目標 ${goalCount(goal)}/${goal.target}</span>`);
  if (t.due) tags.push(`<span class="${t.due < today() && !complete ? 'orange' : ''}">${t.due < today() && !complete ? '期限超過 ' : '締切 '}${shortDay(t.due)}</span>`);
  if (t.project) tags.push(`<span>${esc(t.project)}</span>`);

  else if (complete && t.importedDone) tags.push('<span>旧版で達成</span>');
  if (!complete && t.scheduled && t.scheduled > today()) tags.push(`<span>${shortDay(t.scheduled)}（${weekdayOf(t.scheduled)}）予定</span>`);

}
function forecastLine(task) {

  return `<p class="forecast">${icon(f.willForge ? 'hammer' : 'sword', 14)}<span>${esc(what)}<br><span class="muted">鉄片+${f.iron}${f.ember ? ' 熾火+' + f.ember : ''} EXP+${f.xp}${f.willForge ? ' · 鍛造できる' : ' · 鍛造まで鉄片' + f.needIron + (f.needEmber ? '・熾火' + f.needEmber : '')}</span></span></p>`;
}
function mainCard(task) {
  return `<article class="main-task"><div class="between"><span class="main-label">${icon('target', 13)}今日の主目標</span><button class="iconbtn" data-action="menu" data-id="${esc(task.id)}" aria-label="主目標の操作">${icon('more', 18)}</button></div>
    <h2>${esc(task.title)}</h2><div class="meta">${tagsFor(task)}</div>

    <div class="main-actions"><button class="primary" data-action="start" data-id="${esc(task.id)}">${icon('arrow', 16)}${task.firstStart ? '続ける' : '取りかかる'}</button><button class="secondary" data-action="complete" data-id="${esc(task.id)}">${icon('check', 16)}完了</button></div></article>`;
}
function progressCard() {

  const goals = currentGoals(), goalsDone = goals.filter(g => goalCount(g) >= g.target).length;
  const mainDone = game.results.some(r => r.day === today() && r.main);
  return `<div class="progress-card"><div class="between"><strong>今日 ${ids.size} / ${total} 完了</strong><span class="tiny muted">${mainDone ? '主目標 ✓' : state.main[today()] ? '主目標 未完' : '主目標 未設定'}${goals.length ? ` · 週目標 ${goalsDone}/${goals.length}` : ''}</span></div>
    <div class="bar exp"><span style="width:${total ? ids.size / total * 100 : 0}%"></span></div></div>`;
}
function segmentSummary(r) {
  if (r.repeat) return '踏破した道で素材を集めた。';
  return (r.segments || []).map(x => x.kind === 'cache' ? '資材を回収' : `${esc(x.enemy)}に${x.damage}${x.broke ? '（撃破）' : ''}`).join(' → ');
}
function resultTitle(r) {

  if (r.overflow && r.broken?.length) return '余剰ダメージで、さらに先へ。';
  if (r.phaseShift) return `${r.enemy}：${PHASES[r.phaseShift]}`;
  if (r.broken?.length) return r.broken.at(-1) + 'を撃破した。';

}
function compactResult(r) {

    <p class="source">${segmentSummary(r)}</p><p class="gains">鉄片 +${r.iron}${r.ember ? ' · 熾火 +' + r.ember : ''} · EXP +${r.xp}${r.goalDone ? ' · 週目標達成' : ''}</p></article>`;

function taskRow(t, main) {

  return `<article class="task-row ${complete ? 'done' : ''} ${past ? 'past' : ''} ${main ? 'is-main' : ''}"><button class="checkbtn" data-id="${esc(t.id)}" ${check}>${complete ? icon('check', 13) : ''}</button>
    <button class="body" ${live(t) ? `data-action="start" data-id="${esc(t.id)}"` : 'tabindex="-1"'}><span class="t">${main ? icon('target', 12) + ' ' : ''}${esc(t.title)}</span><span class="meta">${tagsFor(t)}</span></button>

  return `<div class="goal-suggest"><span class="tiny muted">週の目標から今日へ</span>${open.map(g => `<button class="chip" data-action="assign-goal" data-id="${esc(g.id)}">${icon('plus', 12)}${esc(g.title)} <small>${goalCount(g)}/${g.target}</small></button>`).join('')}</div>`;
}
function renderToday() {

    const candidate = sorted(liveTasks.filter(isToday))[0];
    mainHtml = candidate
      ? `<div class="main-task quiet"><span class="main-label">${icon('target', 13)}主目標を一つ選ぶ（追加素材は1日1回）</span><h2>${esc(candidate.title)}</h2><button class="secondary full" data-action="main" data-id="${esc(candidate.id)}">これを主目標にする</button></div>`
      : `<div class="main-task quiet"><span class="main-label">${icon('target', 13)}${game.results.length || state.migrated ? '今日の任務はまだありません' : '最初の一歩'}</span><h2>${game.results.length || state.migrated ? '次にやることを一つ。' : '今から行う、小さな用事を。'}</h2><button class="primary full" data-action="add">${icon('plus', 16)}任務を追加</button></div>`;

  $('page-today').innerHTML = `<div class="home-grid"><div class="visual-col">${sceneBlock()}</div>

/* ---------- week ---------- */
function weeklyStatus(t) {
  // t is the latest occurrence in its series.
  const w = weekStart(today()), days = weekDays(today());
  const anchor = t.occurrence || t.scheduled || today();
  let occ = anchor;
  if (anchor < w) occ = addDays(anchor, Math.ceil(dayDiff(w, anchor) / 7) * 7);
  const thisWeek = days.includes(occ), existing = anchor >= w ? t : null;
  return { occ, thisWeek, existing };
}
function weeklyRow(t) {
  const st = weeklyStatus(t), x = st.existing;
  let status, button = '';
  if (x && done(x)) status = '<span class="ok">✓ 今週は達成</span>';
  else if (x && x.skipped) status = '今週はスキップ';
  else if (x && x.scheduled && x.scheduled <= today()) status = '今日の任務に入っています';
  else if (!st.thisWeek) status = '今週はなし';
  else {
    status = `${shortDay(x?.scheduled || st.occ)}（${weekdayOf(x?.scheduled || st.occ)}）予定`;
    button = `<button class="secondary small" data-action="assign-weekly" data-id="${esc(t.id)}">今日やる</button>`;
  }
  return `<div class="goal-row ${x && done(x) ? 'done' : ''}"><div class="body"><h3>${esc(t.title)}</h3><p class="tiny muted">毎週 ${weekdayOf(t.occurrence || t.scheduled)}曜 · ${t.minutes}分 · ${status}</p></div>${button}<button class="iconbtn" data-action="menu" data-id="${esc((x || t).id)}" aria-label="${esc(t.title)}の操作">${icon('more', 18)}</button></div>`;
}
function goalRow(g) {
  const n = goalCount(g), complete = n >= g.target, assigned = activeTasks().some(t => t.goalId === g.id && isToday(t));
  const pips = Array.from({ length: g.target }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('');
  const action = complete ? '<span class="ok tiny">✓ 達成</span>'
    : assigned ? '<span class="tiny muted">今日に割当済み</span>'
      : goalDoneToday(g) ? '<span class="ok tiny">今日 ✓</span>'
      : `<button class="secondary small" data-action="assign-goal" data-id="${esc(g.id)}">今日やる</button>`;
  return `<div class="goal-row ${complete ? 'done' : ''}"><div class="body"><h3>${esc(g.title)}</h3><div class="pips">${pips}<span class="tiny muted">${g.target === 1 ? '今週中に' : `週${g.target}回 · ${n}/${g.target}`}${g.weekly ? ' · 毎週' : ''}</span></div></div>${action}<button class="iconbtn" data-action="goal-menu" data-id="${esc(g.id)}" aria-label="${esc(g.title)}の操作">${icon('more', 18)}</button></div>`;
}
function latestOfSeries() {
  const latest = new Map();
  for (const t of state.tasks) {
    const old = latest.get(t.seriesId);
    if (!old || (t.occurrence || t.scheduled) > (old.occurrence || old.scheduled)) latest.set(t.seriesId, t);
  }
  return [...latest.values()];
}
function renderWeek() {
  const days = weekDays(today()), goals = currentGoals(), results = allResults();
  const weekly = latestOfSeries().filter(t => t.repeat === 'weekly' && !t.deleted);
  const counts = days.map(d => results.filter(r => r.day === d).length), total = counts.reduce((a, b) => a + b, 0);
  const goalsDone = goals.filter(g => goalCount(g) >= g.target).length;
  $('page-week').innerHTML = `<div class="page-title"><h1>今週</h1><p>${shortDay(days[0])}（月）– ${shortDay(days[6])}（日） · 完了 ${total} 件${goals.length ? ` · 目標 ${goalsDone}/${goals.length}` : ''}</p></div>
    <div class="week-strip">${days.map((d, i) => `<div class="${d === today() ? 'today' : d < today() ? 'past' : ''}"><small>${WEEKDAY[(i + 1) % 7]}</small><b>${Number(d.slice(8))}</b><span>${counts[i] ? counts[i] : '·'}</span></div>`).join('')}</div>
    <div class="week-grid"><section class="panel"><div class="section-head"><h2>週の目標</h2><button class="ghost gold" data-action="add-goal">${icon('plus', 14)}目標を追加</button></div>
      ${goals.length ? goals.map(goalRow).join('') : '<div class="empty">「今週中にレポートを出す」「週3回 運動する」などを登録し、<br>「今日やる」で今日の任務に割り当てます。</div>'}</section>
    <section class="panel"><div class="section-head"><h2>毎週の任務</h2><button class="ghost gold" data-action="add-weekly">${icon('plus', 14)}追加</button></div>
      ${weekly.length ? weekly.map(weeklyRow).join('') : '<div class="empty">繰り返しを「毎週」にした任務がここに並びます。</div>'}</section></div>`;
}
function assignGoal(id) {
  const g = currentGoals().find(x => x.id === id); if (!g) return;
  if (goalCount(g) >= g.target) { toast('この目標は今週達成済みです。'); return; }
  const linked = activeTasks().filter(t => t.goalId === g.id);
  if (linked.some(isToday)) { toast('すでに今日の任務に入っています。'); return; }
  let task = linked[0];
  if (task) task.scheduled = today();
  else {
    const tid = uid();
    task = { id: tid, seriesId: tid, title: g.title, minutes: g.minutes || 25, energy: energyFor(g.minutes || 25), autoEnergy: true, repeat: 'none',
      condition: '', step: '', due: '', scheduled: today(), occurrence: today(), priority: 2, project: '', goalId: g.id,
      createdAt: Date.now(), firstStart: null, importedDone: false, deleted: false };
    state.tasks.push(task);
  }
  if (!state.main[today()]) state.main[today()] = task.id;
  save(); render(); toast(`「${g.title}」を今日の任務に入れました。`);
}
function assignWeekly(id) {
  const t = state.tasks.find(x => x.id === id); if (!t) return;
  const st = weeklyStatus(t);
  if (st.existing) { if (!live(st.existing)) return; st.existing.scheduled = today(); }
  else if (st.thisWeek) {
    const shift = dayDiff(st.occ, t.occurrence || t.scheduled);
    state.tasks.push({ ...t, id: uid(), occurrence: st.occ, scheduled: today(), due: t.due ? addDays(t.due, shift) : '',
      createdAt: Date.now(), firstStart: null, importedDone: false, deleted: false, skipped: false });
  } else return;
  save(); render(); toast(`「${t.title}」を今日の任務に入れました。`);
}
function openGoal(id) {
  const form = $('goalForm'), g = state.goals.find(x => x.id === id); form.reset();
  form.elements.namedItem('id').value = g?.id || '';
  if (g) { form.elements.namedItem('title').value = g.title; form.elements.namedItem('target').value = g.target; form.elements.namedItem('minutes').value = g.minutes || 25; form.elements.namedItem('weekly').checked = g.weekly; }
  $('goalDialogTitle').textContent = g ? '週の目標を編集' : '週の目標を追加';
  fillIcons($('goalDialog')); $('goalDialog').showModal();
}
$('goalForm').addEventListener('submit', event => {
  event.preventDefault();
  const f = event.target.elements, title = f.namedItem('title').value.trim(); if (!title) return;
  const patch = { title: title.slice(0, 100), target: Math.min(7, Math.max(1, Number(f.namedItem('target').value) || 1)), minutes: Number(f.namedItem('minutes').value) || 25, weekly: f.namedItem('weekly').checked };
  const g = state.goals.find(x => x.id === f.namedItem('id').value);
  if (g) { Object.assign(g, patch); state.tasks.filter(t => t.goalId === g.id && live(t)).forEach(t => { t.title = patch.title; }); }
  else { const id = uid(); state.goals.push({ ...patch, id, seriesId: id, week: weekStart(today()), createdAt: Date.now(), deleted: false }); }
  save(); $('goalDialog').close(); render(); toast(g ? '目標を更新しました。' : '週の目標を追加しました。「今日やる」で今日に割り当てます。');
});

/* ---------- adventure ---------- */
function roadmap(region) {
  return `<div class="roadmap">${REGIONS[region].encounters.map((e, i) => `<div class="roadstop ${i < game.stages[region] ? 'done' : i === game.stages[region] ? 'active' : ''}"><span>${i < game.stages[region] ? icon('check', 12) : i + 1}</span>${e.name}</div>`).join('')}</div>`;
}
function renderAdventure() {
  const i = state.region, r = REGIONS[i], e = currentEncounter(game, i);
  $('page-adventure').innerHTML = `<div class="page-title"><h1>冒険</h1><p>${r.sub} ${r.name} — ${r.goal}</p></div>
    <div class="panel">${roadmap(i)}

/* ---------- focus ---------- */

}

/* ---------- complete / animation ---------- */
function completeTask(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task || !live(task)) return;
  const event = { id: uid(), type: 'complete', taskId: id, title: task.title, energy: task.energy,
    main: state.main[today()] === id, day: today(), at: Date.now(), region: state.region, route: state.route };
  state.events.push(event); lastResultSession = event.id;
  save(); // Persist before any presentation or animation.
  if (focus) leaveFocus(); else render();
  const result = game.results.find(r => r.eventId === event.id);
  if (view === 'today') window.scrollTo({ top: 0, behavior: fast() ? 'instant' : 'smooth' });
  if (result?.goalDone) toast(`週の目標「${result.goalDone}」を達成！ 鉄片+3・熾火+1`);
  if (result && view === 'today') { animationQueue.push(result); if (!animating) playNext(); }
}
function playNext() {
  if (!animationQueue.length) { animating = false; return; }
  animating = true;
  const r = animationQueue.shift();
  if (view !== 'today' || state.region !== r.region) { playNext(); return; }
  const steps = r.segments.length ? r.segments : [{ kind: r.repeat ? 'repeat' : 'none' }];
  let index = 0;
  const step = () => {
    if (view !== 'today' || !$('battleScene')) { playNext(); return; }
    if (index >= steps.length) {
      $('battleScene').outerHTML = sceneBlock();
      if (r.victory) toast(REGIONS[r.region].name + 'を踏破。次の地域が解放されました。');
      playNext(); return;
    }
    const seg = steps[index], first = index === 0;
    const frame = { ...game, stages: [...game.stages], health: game.health.map(a => [...a]), tiers: { ...game.tiers }, cleared: [...game.cleared], equipped: r.weapon };
    frame.tiers[r.weapon] = r.tier;
    if (seg.index !== undefined) { frame.stages[r.region] = seg.index; frame.health[r.region][seg.index] = seg.beforeHp; frame.cleared[r.region] = false; }
    $('battleScene').outerHTML = sceneBlock(frame);
    const scene = $('battleScene'), message = $('animationMessage'), number = $('damageNumber');
    const strike = seg.damage > 0;
    if (strike) scene.classList.add('striking');
    if (strike && r.weapon === 'dual') scene.classList.add('dual');
    message.classList.remove('hidden');
    message.textContent = seg.kind === 'cache' ? '鍛造資材を回収した。'
      : seg.kind === 'repeat' ? '踏破した道で、素材を集めた。'
        : !strike ? 'その行動を、次の一撃に。'
          : !first ? `余剰 ${seg.damage} が${seg.enemy}へ` + (seg.broke ? ' — 撃破' : '')
            : r.victory && seg.broke && index === steps.length - 1 ? '闇に、道を開いた。'
              : seg.broke ? seg.enemy + 'を撃破。'
                : seg.phaseAfter > seg.phaseBefore ? `${seg.enemy}：${PHASES[seg.phaseAfter]}`
                  : r.weapon === 'dual' ? '三つの刃が、闇を裂く。' : 'その行動を、一撃に。';
    number.textContent = strike ? (r.weapon === 'dual' ? hitValues(seg.damage, 'dual').join(' + ') : seg.damage) : '';
    sound(r.victory && index === steps.length - 1 ? 'victory' : seg.kind === 'cache' ? 'forge' : 'strike', r.region);
    if (r.weapon === 'dual' && strike) soundTimer = setTimeout(() => sound('strike', r.region), 270);
    if (strike) barTimer = setTimeout(() => {
      const bar = $('sceneBar'), hp = $('sceneHp');
      if (bar && seg.maxHp) bar.style.width = seg.afterHp / seg.maxHp * 100 + '%';
      if (hp && seg.maxHp) hp.textContent = seg.afterHp + ' / ' + seg.maxHp;
    }, fast() ? 0 : 650);
    index++;
    clearTimeout(animationTimer);
    animationTimer = setTimeout(step, fast() ? 150 : seg.kind === 'cache' ? 1200 : 1800);
  };
  step();
}
function sound(kind, region = state.region) {
  if (state.settings.mute) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume();
    const now = audioCtx.currentTime, notes = kind === 'victory' ? [110,146.83,220] : kind === 'forge' ? [294,147,73] : [85,68,56];
    notes.forEach((hz, index) => {
      const oscillator = audioCtx.createOscillator(), gain = audioCtx.createGain(), t = now + index * .1;
      oscillator.type = kind === 'strike' ? 'triangle' : 'sine';
      oscillator.frequency.setValueAtTime(hz * (1 + region * .12), t);
      oscillator.frequency.exponentialRampToValueAtTime(hz * .6, t + .3);
      gain.gain.setValueAtTime(.0001, t); gain.gain.exponentialRampToValueAtTime(Math.max(.0001, state.settings.volume * .25), t + .015);
      gain.gain.exponentialRampToValueAtTime(.0001, t + .75);
      oscillator.connect(gain); gain.connect(audioCtx.destination); oscillator.start(t); oscillator.stop(t + .8);
    });
  } catch (error) { /* Audio is optional. */ }
}
function confirmAction(title, message, callback) {
  $('confirmTitle').textContent = title; $('confirmText').textContent = message;
  confirmCallback = callback; $('confirmDialog').showModal();
}
function undoTask(id) {
  const event = state.events.find(e => e.type === 'complete' && e.taskId === id);
  if (!event) return;
  confirmAction('完了を取り消しますか？', '素材・経験値・突破を再計算します。素材が足りなくなった鍛造も取り消されます。', () => {
    state.events = state.events.filter(e => e.id !== event.id);
    clearAnimation(); lastResultSession = null;
    const invalid = new Set(replay(state).invalid);
    state.events = state.events.filter(e => !invalid.has(e.id));
    save(); render(); toast(invalid.size ? '完了を取り消し、成立しなくなった鍛造も戻しました。' : '完了と、その成果を取り消しました。');
  });
}
function forge(id) {
  if (!WEAPONS.some(w => w.id === id)) return;
  const cost = forgeCost(game.tiers[id]);
  if (game.iron < cost.iron || game.ember < cost.ember) return;
  const tier = game.tiers[id] + 1, milestone = MILESTONES.find(m => m.tier === tier);
  state.events.push({ id: uid(), type: 'forge', weapon: id, targetTier: tier, day: today(), at: Date.now() });
  lastForge = { weapon: id, name: weaponName(id, tier) }; selectedWeapon = id;
  save(); render(); sound('forge'); toast('《' + lastForge.name + '》を鍛造。' + (milestone ? milestone.label + '。' : ''));
}

/* ---------- end of day ---------- */
function openEndDay() {
  const day = today(), existing = state.daily[day], results = resultsForDay(day), achievements = dayAchievements(day);
  $('endSummary').innerHTML = `<div class="summary-part"><h3>現実で進めたこと · ${results.length}件</h3>${results.length ? '<ul>' + results.map(r => '<li>' + esc(r.title) + (r.main ? '（主目標）' : '') + '</li>').join('') + '</ul>' : '<p class="tiny muted">今日は休息の日。装備や成長は失われません。</p>'}</div>
    <div class="summary-part"><h3>冒険の成果</h3>${achievements.length ? '<ul>' + achievements.map(a => '<li>' + esc(a) + '</li>').join('') + '</ul>' : '<p class="tiny muted">' + (results.length ? '次の突破に向けた一撃と素材が残りました。' : '焚き火は、まだ消えていない。') + '</p>'}<p class="tiny gold" style="margin-top:8px">鉄片 +${results.reduce((n, r) => n + (r.iron || 0), 0)} / EXP +${results.reduce((n, r) => n + (r.xp || 0), 0)}</p></div>`;
  $('endForm').reset(); $('tomorrowStep').value = existing?.tomorrow || ''; $('dayNote').value = existing?.note || '';
  $('endDialog').showModal(); fillIcons($('endDialog'));
}
$('endForm').addEventListener('submit', event => {
  event.preventDefault();
  const form = new FormData(event.target), day = today(), tomorrow = String(form.get('tomorrow') || '').trim();
  const record = { ...state.daily[day], tomorrow, note: String(form.get('note') || '').trim(), closedAt: Date.now(), reopened: false };
  if (tomorrow && form.get('plan')) {
    const nextDay = addDays(day, 1); let task = state.tasks.find(t => t.id === record.tomorrowTaskId);
    if (task && !done(task)) { task.title = tomorrow; task.step = tomorrow; task.scheduled = nextDay; task.deleted = false; }
    else if (!task) {
      const id = uid(); task = { id, seriesId: id, title: tomorrow, step: tomorrow, condition: '', minutes: 25, energy: 2, autoEnergy: true, repeat: 'none', occurrence: nextDay, scheduled: nextDay, due: '', priority: 2, project: '', createdAt: Date.now(), firstStart: null, importedDone: false, deleted: false };
      state.tasks.push(task); record.tomorrowTaskId = id;
    }
    if (task && !done(task)) state.main[nextDay] = task.id;
  }
  state.daily[day] = record;
  save(); $('endDialog').close(); clearAnimation(); lastResultSession = null; render();
  toast('今日の遠征を終えました。お疲れさまでした。');
});

/* ---------- backup ---------- */
function exportSave() {
  EmberStorage.download('emberquest-save-' + today() + '.json', EmberStorage.serialize(state), 'application/json');
  toast('JSONバックアップを書き出しました。');
}
$('importFile').addEventListener('change', async event => {
  const file = event.target.files[0]; event.target.value = '';
  if (!file) return;
  if (file.size > 20 * 1024 * 1024) { toast('20MB以下のJSONバックアップを選んでください。'); return; }
  try {
    const next = EmberStorage.parse(await file.text());
    confirmAction('バックアップから復元しますか？', next.tasks.filter(t => !t.deleted).length + '件の任務を読み込み、現在の進捗を置き換えます。必要なら先にJSONを書き出してください。', () => {
      clearAnimation(); state = next; if (!state.goals) state.goals = []; lastResultSession = null; lastForge = null; game = replay(state); refreshRecurrence(); game = replay(state); selectedWeapon = game.equipped;
      save(); render(); toast('任務・装備・遠征の記録を復元しました。');
    });
  } catch (error) { toast('復元できません：' + error.message); }
});
$('confirmNo').onclick = () => { confirmCallback = null; $('confirmDialog').close(); };
$('confirmYes').onclick = () => { const callback = confirmCallback; confirmCallback = null; $('confirmDialog').close(); callback?.(); };
$('confirmDialog').addEventListener('cancel', () => { confirmCallback = null; });

/* ---------- events ---------- */
document.addEventListener('click', event => {
  const button = event.target.closest('[data-action]');
  if (!button || button.disabled) return;
  if (button.closest('#menuDialog')) $('menuDialog').close();
  const action = button.dataset.action, id = button.dataset.id, task = state.tasks.find(t => t.id === id), goal = state.goals.find(g => g.id === id);
  switch (action) {
    case 'nav': navigate(button.dataset.view); break;
    case 'add': openTask(); break;
    case 'add-weekly': openTask(null, { repeat: 'weekly' }); break;
    case 'edit': openTask(id); break;
    case 'menu': if (task) taskMenu(task); break;
    case 'close-menu': $('menuDialog').close(); break;
    case 'template': templateTask(button.dataset.template); break;
    case 'close-task': $('taskDialog').close(); break;
    case 'close-goal': $('goalDialog').close(); break;
    case 'main':
      if (task && live(task)) { state.main[today()] = id; task.scheduled = today(); if (state.daily[today()]) state.daily[today()].reopened = true; save(); render(); toast('今日の主目標にしました。'); }
      break;
    case 'unmain': delete state.main[today()]; save(); render(); break;
    case 'assign-today': if (task && live(task)) { task.scheduled = today(); save(); render(); toast('今日の任務に入れました。'); } break;
    case 'skip':
      if (task && live(task)) { skipOccurrence(task); if (state.main[today()] === id) delete state.main[today()]; save(); render(); toast('今回だけスキップしました。次の回は予定どおり作られます。'); }
      break;
    case 'unskip': if (task) { task.skipped = false; save(); render(); } break;
    case 'stop-repeat':
      if (task) confirmAction('今後の繰り返しを停止しますか？', `「${task.title}」の次の回を作らなくなります。今回の分は残ります。`, () => { stopSeries(state, task.seriesId); save(); render(); toast('繰り返しを停止しました。今回の分は残っています。'); });
      break;
    case 'start': startTask(id); break;
    case 'leave-focus': leaveFocus(); break;
    case 'toggle-timer': if (focus) { focus.showTimer = !focus.showTimer; renderFocus(); } break;
    case 'timer':
      if (!focus) break;
      if (focus.running) { focus.remaining = remaining(); focus.running = false; }
      else { if (focus.remaining <= 0) focus.remaining = (state.tasks.find(t => t.id === focus.taskId)?.minutes || 25) * 60000; focus.endAt = Date.now() + focus.remaining; focus.running = true; }
      renderFocus(); break;
    case 'complete': completeTask(id); break;
    case 'undo': undoTask(id); break;
    case 'archive':
      if (task) { task.deleted = true; if (state.main[today()] === id) delete state.main[today()]; save(); render(); toast('保管しました。記録タブから戻せます。'); }
      break;
    case 'restore-task': if (task) { task.deleted = false; refreshRecurrence(); save(); render(); } break;
    case 'filter': filter = button.dataset.filter; renderToday(); fillIcons($('page-today')); break;
    case 'add-goal': openGoal(); break;
    case 'edit-goal': openGoal(id); break;
    case 'goal-menu': if (goal) goalMenu(goal); break;
    case 'assign-goal': assignGoal(id); break;
    case 'assign-weekly': assignWeekly(id); break;
    case 'archive-goal': if (goal) { goal.deleted = true; save(); render(); toast('目標を外しました。'); } break;
    case 'route': state.route = button.dataset.route; save(); render(); break;
    case 'region':
      if (Number(button.dataset.region) <= game.unlocked) { clearAnimation(); state.region = Number(button.dataset.region); save(); render(); sound('victory'); toast(REGIONS[state.region].name + 'へ向かいます。'); }
      break;
    case 'select-weapon': selectedWeapon = button.dataset.weapon; renderEquipment(); fillIcons($('page-equipment')); break;
    case 'forge': forge(button.dataset.weapon); break;
    case 'equip':
      if (game.tiers[button.dataset.weapon] >= 0) { state.events.push({ id: uid(), type: 'equip', weapon: button.dataset.weapon, day: today(), at: Date.now() }); save(); render(); sound('forge'); toast('装備を変更しました。'); }
      break;
    case 'mute': state.settings.mute = !state.settings.mute; save(); render(); if (!state.settings.mute) sound('forge'); break;
    case 'end-day': openEndDay(); break;
    case 'close-end': $('endDialog').close(); break;
    case 'export': exportSave(); break;
    case 'import': $('importFile').click(); break;
  }
});
document.addEventListener('change', event => {
  if (event.target.id === 'soundSetting') { state.settings.mute = !event.target.checked; save(); render(); sound('forge'); }
  if (event.target.id === 'volumeSetting') { state.settings.volume = Number(event.target.value); save(); sound('forge'); }
  if (event.target.id === 'motionSetting') { state.settings.reduced = event.target.checked; clearAnimation(); save(); render(); }
});
document.addEventListener('submit', event => {
  if (event.target.id !== 'feedbackForm') return;
  event.preventDefault(); const data = new FormData(event.target);
  state.feedback.push({ day: today(), reward: Number(data.get('reward')), entry: Number(data.get('entry')), note: String(data.get('note') || '').slice(0,1000) });
  save(); render(); toast('振り返りを残しました。');
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && focus) leaveFocus();
  if (event.key === 'Tab' && focus) {
    const controls = [...$('focusOverlay').querySelectorAll('button:not(:disabled)')].filter(b => b.getClientRects().length);
    const first = controls[0], last = controls.at(-1);
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }
});
function refreshDay() {
  if (today() !== lastDay) {
    lastDay = today(); refreshRecurrence();
    if (!focus) render();
  }
}
setInterval(refreshDay, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { updateTimer(); refreshDay(); } });
refreshRecurrence(); render();
if (loaded.notice) toast(loaded.notice);

</script>
</body>
